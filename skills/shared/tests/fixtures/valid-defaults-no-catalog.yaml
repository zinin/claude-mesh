# The common shape: a defaults: preset that asks for the built-in claude reviewer on a machine
# with no claude.models catalog. Both orchestrators then run exactly ONE reviewer, named plain
# `claude` (mesh-design-review Step 5.1, mesh-review Step 2.4) — which is also how the selection
# UI spells it in that case, and therefore how the SUMMARY must spell it on both lines.
#
# Its sibling valid-defaults-preset.yaml covers the other branch (catalog present ⇒
# claude:<model>); neither fixture can reach the other's branch, which is why there are two.
providers:
  - id: zai
    label: "Z.AI"
    base_url: https://api.z.ai/api/anthropic
    token: "tkn-zai"

models:
  - id: zai/glm
    label: "GLM"
    model: glm-5.1

defaults:
  design_review:
    builtin: [claude]
    models: [zai/glm]
  code_review:
    builtin: [claude]
